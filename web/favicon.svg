<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="cf-bg" cx="35%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#121828"/>
      <stop offset="55%" stop-color="#090C15"/>
      <stop offset="100%" stop-color="#040508"/>
    </radialGradient>

    <!-- Outer Rim Cyan Glow Gradient -->
    <linearGradient id="cf-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="40%" stop-color="#22D3EE"/>
      <stop offset="75%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- 9:16 Inner Viewport Gradient -->
    <linearGradient id="cf-view-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B0E18"/>
      <stop offset="100%" stop-color="#06070D"/>
    </linearGradient>

    <!-- Play Arrow Radiant Core -->
    <linearGradient id="cf-play" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#A5F3FC"/>
      <stop offset="60%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>

    <!-- Sprocket Gradient -->
    <linearGradient id="cf-sprocket" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#172033"/>
      <stop offset="100%" stop-color="#0F1524"/>
    </linearGradient>

    <!-- Drop Shadow Glow Filter -->
    <filter id="cf-glow-play" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#22D3EE" flood-opacity="0.75"/>
    </filter>

    <filter id="cf-glow-spark" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#67E8F9" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Dark Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#cf-bg)"/>
  
  <!-- Glowing Cyan Rim -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="none" stroke="url(#cf-rim)" stroke-width="14" stroke-opacity="0.95"/>
  <rect x="35" y="35" width="442" height="442" rx="105" fill="none" stroke="#22D3EE" stroke-width="2" stroke-opacity="0.25"/>

  <!-- Film Sprockets Left Side -->
  <rect x="48" y="132" width="34" height="60" rx="10" fill="url(#cf-sprocket)" stroke="#22D3EE" stroke-width="2.5" stroke-opacity="0.6"/>
  <rect x="48" y="226" width="34" height="60" rx="10" fill="url(#cf-sprocket)" stroke="#22D3EE" stroke-width="2.5" stroke-opacity="0.6"/>
  <rect x="48" y="320" width="34" height="60" rx="10" fill="url(#cf-sprocket)" stroke="#22D3EE" stroke-width="2.5" stroke-opacity="0.6"/>

  <!-- Film Sprockets Right Side -->
  <rect x="430" y="132" width="34" height="60" rx="10" fill="url(#cf-sprocket)" stroke="#22D3EE" stroke-width="2.5" stroke-opacity="0.6"/>
  <rect x="430" y="226" width="34" height="60" rx="10" fill="url(#cf-sprocket)" stroke="#22D3EE" stroke-width="2.5" stroke-opacity="0.6"/>
  <rect x="430" y="320" width="34" height="60" rx="10" fill="url(#cf-sprocket)" stroke="#22D3EE" stroke-width="2.5" stroke-opacity="0.6"/>

  <!-- Center 9:16 Viral Video Frame -->
  <rect x="122" y="68" width="268" height="376" rx="28" fill="url(#cf-view-grad)" stroke="#232E47" stroke-width="4"/>
  <rect x="127" y="73" width="258" height="366" rx="23" fill="none" stroke="#22D3EE" stroke-width="2" stroke-opacity="0.28"/>

  <!-- Optically Centered Radiant Play Arrow -->
  <path d="M226 172 C226 160 238 152 248 159 L350 245 C359 251 359 261 350 267 L248 353 C238 360 226 352 226 340 Z"
        fill="url(#cf-play)"
        filter="url(#cf-glow-play)"/>

  <!-- AI Sparkle Flare (Top Right of Viewport) -->
  <path d="M374 72 Q374 100 402 100 Q374 100 374 128 Q374 100 346 100 Q374 100 374 72 Z"
        fill="#FFFFFF"
        filter="url(#cf-glow-spark)"/>
  <circle cx="374" cy="100" r="3.5" fill="#FFFFFF"/>
</svg>